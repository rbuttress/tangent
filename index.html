<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyG Tangential Knife Controller</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="bgCanvas"></canvas>

    <div id="ui-layer">
        <div class="widget" id="conn-widget">
            <div class="widget-header">SPJS Connection</div>
            <div class="widget-body">
                <input type="text" id="spjsAddr" value="ws://localhost:8989/ws">
                <button id="btnConnectSPJS">Connect Server</button>
                <hr>
                <select id="portList"><option>Scan for ports...</option></select>
                <button id="btnOpenPort">Connect TinyG</button>
                <div id="console"></div>
            </div>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
